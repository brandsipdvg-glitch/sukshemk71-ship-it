<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SoundShare sender — encode text into FSK audio tones and transmit through your speaker.">
  <title>SoundShare — Send</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html">SoundShare</a>
      <span class="crumb">/ Send</span>
    </header>

    <main>
      <section class="card">
        <h2>Compose message</h2>
        <textarea id="message" rows="5" maxlength="2048"
          placeholder="Type a message to transmit over sound…"></textarea>
        <div class="meta" id="metaText">0 bytes · 0 bits · 0.0 s</div>

        <div class="controls">
          <div class="modegroup" style="display:inline-flex;gap:14px;align-items:center;margin-right:14px">
            <span><input type="radio" name="mode" id="modeFast" checked>
              <label for="modeFast" style="margin:0">⚡ Fast ≈1.5 s (4-FSK)</label></span>
            <span><input type="radio" name="mode" id="modeSlow">
              <label for="modeSlow" style="margin:0">🐢 Slow ≈20 s (2-FSK)</label></span>
          </div>
          <button id="sendBtn" class="btn primary">Send</button>
          <button id="stopBtn" class="btn stop" disabled>Stop</button>
          <label class="vol">Volume
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.9">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Status</h2>
        <div class="statusline">
          <span id="statusPill" class="pill idle">Idle</span>
          <span id="statusText">Ready</span>
        </div>
        <div class="progress">
          <div id="progressBar" class="progressbar"></div>
        </div>
        <div id="progressLabel" class="muted">Waiting for a message</div>
      </section>

      <section class="card">
        <h2>Transmitter debug</h2>
        <div class="debuggrid">
          <div><label>Current frequency</label><output id="dbgFreq">—</output></div>
          <div><label>Current bit</label><output id="dbgBit">—</output></div>
          <div><label>Bit progress</label><output id="dbgProgress">—</output></div>
          <div><label>Packet bits</label><output id="dbgTotal">—</output></div>
          <div><label>Elapsed</label><output id="dbgElapsed">—</output></div>
          <div><label>Audio context</label><output id="dbgCtx">—</output></div>
        </div>
      </section>
    </main>

    <footer>SoundShare · ⚡ Fast ≈1.5 s (4-FSK, 15 ms/tone) · 🐢 Slow ≈20 s (2-FSK, 100 ms/tone)</footer>
  </div>

  <script src="js/crc.js"></script>
  <script src="js/encoder.js"></script>
  <script src="js/audio.js"></script>
  <script>
    (() => {
      "use strict";

      const el = (id) => document.getElementById(id);
      const message = el("message");
      const sendBtn = el("sendBtn");
      const stopBtn = el("stopBtn");
      const volume = el("volume");
      const modeFast = el("modeFast");
      const metaText = el("metaText");
      const pill = el("statusPill");
      const statusText = el("statusText");
      const progressBar = el("progressBar");
      const progressLabel = el("progressLabel");
      const dbg = {
        freq: el("dbgFreq"), bit: el("dbgBit"), prog: el("dbgProgress"),
        total: el("dbgTotal"), elapsed: el("dbgElapsed"), ctx: el("dbgCtx"),
      };

      const tx = new SS.Audio.Transmitter();

      const MODE = {
        fast: { label: "Fast", encode: SS.Encoder.encodeTextQuad,
                play: (pkt, o) => tx.playQuads(pkt.quads, o),
                unit: "symbol", toneOf: (pkt, i) => SS.Protocol.QUAD_TONES[pkt.quads[i]] + " Hz" },
        slow: { label: "Slow", encode: SS.Encoder.encodeText,
                play: (pkt, o) => tx.play(pkt.packetBits, o),
                unit: "bit", toneOf: (pkt, i) => (pkt.packetBits[i] ? "2000 Hz" : "1000 Hz") },
      };
      const currentMode = () => (modeFast.checked ? MODE.fast : MODE.slow);

      /* ------------------------------------------------------------ */
      /* Small UI helpers                                              */
      /* ------------------------------------------------------------ */

      function setStatus(name, text) {
        pill.className = "pill " + name;
        pill.textContent = name.charAt(0).toUpperCase() + name.slice(1);
        statusText.textContent = text;
      }

      function setProgress(frac, label) {
        progressBar.style.width = Math.max(0, Math.min(100, frac * 100)) + "%";
        progressLabel.textContent = label;
      }

      function formatDuration(seconds) {
        if (seconds < 60) return seconds.toFixed(1) + " s";
        const m = Math.floor(seconds / 60);
        const s = Math.round(seconds - m * 60);
        return m + " min " + s + " s";
      }

      /* ------------------------------------------------------------ */
      /* Live stats while typing                                       */
      /* ------------------------------------------------------------ */

      function updateStats() {
        const mode = currentMode();
        try {
          const p = mode.encode(message.value);
          metaText.textContent =
            p.byteCount + " byte" + (p.byteCount === 1 ? "" : "s") + " · " +
            (p.totalBits ? p.totalBits + " bits · " : p.totalSymbols + " symbols · ") +
            "~" + formatDuration(p.durationSeconds) +
            (mode === MODE.fast ? " (fast)" : " (slow)");
        } catch (e) {
          metaText.textContent = message.value.trim()
            ? "⚠ " + e.message
            : "0 bytes · 0 bits · 0.0 s";
        }
      }
      message.addEventListener("input", updateStats);
      modeFast.addEventListener("change", updateStats);
      document.querySelectorAll("input[name=mode]").forEach((r) =>
        r.addEventListener("change", updateStats));
      updateStats();

      /* ------------------------------------------------------------ */
      /* Transmission                                                  */
      /* ------------------------------------------------------------ */

      async function send() {
        if (tx.playing) return;

        const text = message.value;
        if (!text.trim()) {
          setStatus("error", "Message is empty — type something first.");
          return;
        }

        const mode = currentMode();
        const P = SS.Protocol;
        const unit = mode.unit;

        /* Phase 1: encoding. */
        let packet;
        try {
          setStatus("encoding", "Encoding text (" + mode.label + ")…");
          await new Promise((r) => setTimeout(r, 40)); /* paint the pill */
          packet = mode.encode(text);
        } catch (e) {
          setStatus("error", "Encoding failed: " + e.message);
          return;
        }

        const totalBits = packet.totalBits || packet.totalSymbols * 2;
        dbg.total.textContent =
          (packet.totalSymbols || packet.totalBits) + " " + unit + "s" +
          (mode === MODE.fast ? " (~" + totalBits + " bits)" : "");
        dbg.ctx.textContent = tx.ctx ? tx.ctx.state : "new";

        sendBtn.disabled = true;
        stopBtn.disabled = false;

        /* Phase 2: transmitting (tones on air). */
        setStatus("transmitting",
          "Playing " + (packet.totalSymbols || packet.totalBits) +
          " " + unit + "s…");

        const done = mode.play(packet, {
          volume: parseFloat(volume.value),
          onProgress: (doneN, totalN) => {
            const secs = doneN *
              (mode === MODE.fast ? P.QUAD_SYMBOL_SECONDS : P.SYMBOL_SECONDS);
            const freq = doneN < totalN ? mode.toneOf(packet, doneN) : "—";
            setProgress(doneN / totalN,
              doneN + " / " + totalN + " " + unit + "s · " +
              formatDuration(secs) + " elapsed");
            dbg.freq.textContent = freq;
            dbg.bit.textContent = doneN < totalN
              ? String(packet.quads ? packet.quads[doneN] : packet.packetBits[doneN])
              : "—";
            dbg.prog.textContent = doneN + " / " + totalN;
            dbg.elapsed.textContent = formatDuration(secs);
          },
        });

        setProgress(0, "Tones scheduled — transmission starting…");

        let aborted = false;
        try {
          aborted = await done;
        } catch (e) {
          /* play() itself never rejects; safety net only. */
        }

        /* Phase 3: complete (or stopped — handled by the Stop button). */
        if (aborted) return;
        setProgress(1, "All tones emitted.");
        setStatus("complete", "Transmission complete in ~" +
          formatDuration(packet.durationSeconds) + " (0.2 s lead-in).");

        dbg.freq.textContent = "—";
        dbg.bit.textContent = "—";
        dbg.prog.textContent = "—";
        dbg.elapsed.textContent = "—";

        sendBtn.disabled = false;
        stopBtn.disabled = true;
      }

      stopBtn.addEventListener("click", async () => {
        await tx.stop();
        setProgress(0, "Stopped by user.");
        setStatus("error", "Transmission stopped.");
        dbg.freq.textContent = "—";
        dbg.bit.textContent = "—";
        dbg.prog.textContent = "—";
        dbg.elapsed.textContent = "—";
        sendBtn.disabled = false;
        stopBtn.disabled = true;
      });

      sendBtn.addEventListener("click", send);

      /* Cmd/Ctrl+Enter sends from the textarea. */
      message.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") send();
      });
    })();
  </script>
</body>
</html>
